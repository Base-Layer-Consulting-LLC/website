---
################################################################################
# Validate Astro site changes in pull requests targeting main                  #
#                                                                              #
# This workflow builds the Astro site through the shared PipelineTemplates     #
# workflow. It does not create version bumps, tags, GitHub releases, or        #
# deployments.                                                                 #
################################################################################

name: PR validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "site/src/**"
      - "site/public/**"
      - "site/astro.config.*"
      - "site/package.json"
      - "site/package-lock.json"
      - "site/npm-shrinkwrap.json"
      - "site/pnpm-lock.yaml"
      - "site/yarn.lock"
      - "site/tsconfig.json"
      - "site/tailwind.config.*"
      - "site/postcss.config.*"
      - "site/wrangler.json"
      - "site/wrangler.jsonc"
      - "scripts/astro/**"
      - "scripts/install/node.sh"
      - "scripts/install/_common.sh"
      - ".github/workflows/pr-checks.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Astro site
    uses: redjax/PipelineTemplates/.github/workflows/astro-build.yml@feat/astro-workflows

    with:
      runner: ubuntu-latest

      working-directory: "."
      astro-project-dir: site
      output-dir: ${{ vars.CLOUDFLARE_PAGES_ROOT_DIR }}

      node-version: "24"
      install-command: npm ci
      build-command: ./scripts/astro/build.sh

      clean: true

      ## The trigger paths already decide whether this workflow starts.
      #  Build unconditionally once it starts so PR validation cannot
      #  accidentally skip a required build.
      check-changed: false

      use-node-cache: true
      debug-build: false

      build-env: |
        PUBLIC_BUSINESS_NAME=${{ vars.PUBLIC_BUSINESS_NAME }}
        PUBLIC_BUSINESS_NAME_SHORT=${{ vars.PUBLIC_BUSINESS_NAME_SHORT }}
        PUBLIC_BUSINESS_TAGLINE=${{ vars.PUBLIC_BUSINESS_TAGLINE }}
        PUBLIC_CONTACT_EMAIL_ADDR_MAIN=${{ vars.PUBLIC_CONTACT_EMAIL_ADDR_MAIN }}
        PUBLIC_FORMSPREE_CONTACT_FORM_ID=${{ vars.PUBLIC_FORMSPREE_CONTACT_FORM_ID }}

      artifact-name: astro-pr-site
      artifact-retention-days: 3
      artifact-if-no-files-found: error

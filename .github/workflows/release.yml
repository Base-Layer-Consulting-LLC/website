---
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run without committing, tagging, or publishing
        required: false
        default: "false"
        type: string
      base_branch:
        description: Base branch to compare against
        required: false
        default: main
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.run_release.outputs.released }}
      version: ${{ steps.run_release.outputs.version }}
    env:
      BASE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.base_branch || 'main' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Make scripts executable
        run: chmod +x scripts/versioning/*.sh scripts/release/*.sh scripts/install/*.sh scripts/astro/*.sh

      - name: Install required tools
        run: |
          ./scripts/install/git.sh
          ./scripts/install/curl.sh
          ./scripts/install/bump-my-version.sh
          ./scripts/install/gh.sh

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies (script owns build)
        run: npm ci --prefix site

      - name: Run release
        id: run_release
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DRY_RUN_FLAG=""
          if [[ "$DRY_RUN" == "true" ]]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          ./scripts/release/release.sh $DRY_RUN_FLAG release --base-branch "$BASE_BRANCH"

  deploy_cloudflare:
    needs: release
    if: needs.release.outputs.released == 'true'
    uses: ./.github/workflows/deploy-cloudflare.yml
    with:
      version: ${{ needs.release.outputs.version }}
      tag: v${{ needs.release.outputs.version }}
      dry_run: false
      force: false
    secrets: inherit

---
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run without committing, tagging, or publishing
        required: false
        default: "false"
        type: string
      base_branch:
        description: Base branch to compare against
        required: false
        default: main
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BASE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.base_branch || 'main' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Make scripts executable
        run: chmod +x scripts/versioning/*.sh scripts/release/*.sh scripts/install/*.sh scripts/astro/*.sh

      - name: Install required tools
        run: |
          ./scripts/install/git.sh
          ./scripts/install/curl.sh
          ./scripts/install/bump-my-version.sh
          ./scripts/install/gh.sh

      - name: Detect site changes
        id: site_changes
        run: |
          echo "changed=$(
            ./scripts/release/detect-changes.sh "$BASE_BRANCH" | cut -d= -f2
          )" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.site_changes.outputs.changed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        if: steps.site_changes.outputs.changed == 'true'
        working-directory: site
        run: npm ci

      - name: Configure git identity
        if: steps.site_changes.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run release
        if: steps.site_changes.outputs.changed == 'true'
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DRY_RUN_FLAG=""
          if [[ "$DRY_RUN" == "true" ]]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          ./scripts/release/release.sh $DRY_RUN_FLAG release --base-branch "$BASE_BRANCH"

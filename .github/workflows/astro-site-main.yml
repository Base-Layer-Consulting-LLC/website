---
################################################################################
# Astro site pipeline                                                          #
#                                                                              #
# This repository declares policy and site configuration only. The central     #
# PipelineTemplates workflow handles version bumping, build, GitHub releases,  #
# archive creation, and selected publication targets.                          #
################################################################################

name: Astro Site Main

on:
  push:
    branches:
      - feat/astro-pipelines
    #   - main
    # paths:
    #   - "site/src/**"
    #   - "site/public/**"
    #   - "site/astro.config.*"
    #   - "site/package.json"
    #   - "site/package-lock.json"
    #   - "site/npm-shrinkwrap.json"
    #   - "site/pnpm-lock.yaml"
    #   - "site/yarn.lock"
    #   - "site/tsconfig.json"
    #   - "site/tailwind.config.*"
    #   - "site/postcss.config.*"
    #   - "site/wrangler.json"
    #   - "site/wrangler.jsonc"
    #   - "scripts/astro/**"
    #   - "scripts/install/node.sh"
    #   - "scripts/install/_common.sh"
    #   - ".github/workflows/astro-site-main.yml"

  workflow_dispatch:
    inputs:
      publish-targets:
        description: JSON array of publication targets.
        required: true
        type: choice
        default: '["cloudflare-pages"]'
        options:
          - "[]"
          - '["cloudflare-pages"]'
          - '["github-pages"]'
          - '["branch"]'
          - '["github-pages","cloudflare-pages"]'
          - '["github-pages","cloudflare-pages","branch"]'

      create-github-release:
        description: Create a GitHub Release with .tar.gz and .zip site archives.
        required: false
        type: boolean
        default: true

      release-tag:
        description: Optional explicit Git tag. Leave empty for derived tag naming.
        required: false
        type: string
        default: ""

      release-name:
        description: Optional explicit GitHub Release name.
        required: false
        type: string
        default: ""

      release-version:
        description: Optional explicit release version.
        required: false
        type: string
        default: ""

      debug-build:
        description: Print detailed Astro build diagnostics.
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  site:
    name: Build, release, and publish Astro site
    uses: redjax/PipelineTemplates/.github/workflows/astro-site-main.yml@feat/astro-workflows

    with:
      versioned: true
      version-file: VERSION
      bump-config: .bumpversion.toml

      # bump-base-branch: main
      bump-base-branch: feat/astro-pipelines
      # bump-pr-branch: bump/astro-site-version
      bump-pr-branch: bump/astro-site-version-test
      bump-commit-marker: "[astro-version-bump]"

      ## Keep while testing the central Astro workflows. Set to main after merge.
      templates-ref: feat/astro-workflows

      working-directory: "."
      astro-project-dir: site

      ## Must directly contain index.html after the Astro build.
      output-dir: ${{ vars.CLOUDFLARE_PAGES_ROOT_DIR }}

      node-version: "24"
      install-command: npm ci
      build-command: ./scripts/astro/build.sh

      clean: true
      use-node-cache: true

      build-env: |
        PUBLIC_BUSINESS_NAME=${{ vars.PUBLIC_BUSINESS_NAME }}
        PUBLIC_BUSINESS_NAME_SHORT=${{ vars.PUBLIC_BUSINESS_NAME_SHORT }}
        PUBLIC_BUSINESS_TAGLINE=${{ vars.PUBLIC_BUSINESS_TAGLINE }}
        PUBLIC_CONTACT_EMAIL_ADDR_MAIN=${{ vars.PUBLIC_CONTACT_EMAIL_ADDR_MAIN }}
        PUBLIC_FORMSPREE_CONTACT_FORM_ID=${{ vars.PUBLIC_FORMSPREE_CONTACT_FORM_ID }}

      ## Full release lanes must always produce an artifact.
      check-changed: false

      artifact-name: astro-site
      artifact-retention-days: 7
      artifact-if-no-files-found: error

      ## Preserve existing tag style: v0.2.4, v0.2.3, etc.
      versioned-tag-prefix: v

      ## Used for non-versioned, SHA-based release names.
      release-prefix: site

      publish-targets: >-
        ${{
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.publish-targets ||
          '["cloudflare-pages"]'
        }}

      create-github-release: >-
        ${{
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.create-github-release == 'true' ||
          true
        }}

      release-tag: >-
        ${{
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.release-tag ||
          ''
        }}

      release-name: >-
        ${{
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.release-name ||
          ''
        }}

      release-version: >-
        ${{
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.release-version ||
          ''
        }}

      debug-build: >-
        ${{
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.debug-build == 'true' ||
          false
        }}

      cloudflare-pages-project: ${{ vars.CLOUDFLARE_PAGES_PROJECT_PROD }}
      cloudflare-pages-branch: main
      cloudflare-wrangler-version: "4.147.0"

      runner: ubuntu-latest

      branch-name: gh-pages
      branch-commit-message: Deploy Astro site

    secrets:
      release-bot-pat: ${{ secrets.RELEASE_BOT_PAT }}
      cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

---
name: Test Astro build and GitHub release

on:
  push:
    branches:
      - feat/astro-pipelines

  workflow_dispatch:
    inputs:
      create-github-release:
        description: Create the GitHub Release after creating the tag.
        required: false
        type: boolean
        default: false

      release-tag:
        description: Optional explicit test tag. Leave empty to derive it from VERSION.
        required: false
        type: string
        default: ""

      release-name:
        description: Optional explicit test release name.
        required: false
        type: string
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build Astro site
    uses: redjax/PipelineTemplates/.github/workflows/astro-build.yml@feat/astro-workflows
    with:
      runner: ubuntu-latest

      working-directory: "."
      astro-project-dir: "site"
      output-dir: "site/dist"

      node-version: "24"
      install-command: "npm ci"
      build-command: "./scripts/astro/build.sh"

      clean: true

      # A test/release workflow must always have an artifact.
      # Do not let change detection skip the build here.
      check-changed: false

      use-node-cache: true
      debug-build: true

      artifact-name: astro-site-test
      artifact-retention-days: 7
      artifact-if-no-files-found: error

  release:
    name: Create Astro GitHub release
    needs:
      - build
    if: ${{ needs.build.result == 'success' }}

    uses: redjax/PipelineTemplates/.github/workflows/astro-gh-release.yml@feat/astro-workflows
    with:
      versioned: true
      version-file: VERSION

      artifact-name: astro-site-test

      ## This is the run ID containing the artifact uploaded by `build`.
      build-run-id: ${{ github.run_id }}

      ## Existing repository tags use vX.Y.Z, not site-vX.Y.Z.
      #  See the required central-workflow refinement below.
      release-prefix: site

      release-tag: ${{ github.event.inputs.release-tag || '' }}
      release-name: ${{ github.event.inputs.release-name || '' }}

      create-github-release: ${{ github.event.inputs.create-github-release == 'true' }}

      ## This is a feature-branch test. It ensures the tag points to the
      #  exact commit that ran this build.
      checkout-ref: ${{ github.sha }}

      runner: ubuntu-latest

    secrets:
      release-bot-pat: ${{ secrets.RELEASE_BOT_PAT }}

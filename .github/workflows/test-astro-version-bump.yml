---
name: Test Astro version bump

on:
  push:
    branches:
      - feat/astro-build-pipeline
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    uses: redjax/PipelineTemplates/.github/workflows/astro-version-bump.yml@feat/astro-workflows
    with:
      base-branch: main

      bump-script: shared/scripts/ci-cd/astro/bump-site-version.sh
      bump-branch: ci/astro-version-bump

      commit-message: "chore(astro): bump site version"
      pull-request-title: "chore(astro): bump site version"
      pull-request-labels: |
        automated
        version-bump

      delete-branch: true
      auto-merge: false
      auto-merge-method: merge

    secrets:
      release-bot-pat: ${{ secrets.RELEASE_BOT_PAT }}

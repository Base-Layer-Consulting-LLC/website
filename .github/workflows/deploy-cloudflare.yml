---
##########################################################
# Deploy latest Github release asset to Cloudflare Pages #
##########################################################

name: Deploy to Cloudflare Pages

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version/tag to deploy, like 0.1.0. Defaults to latest release.
        required: false
        default: ""
        type: string
      dry_run:
        description: Run without deploying anything
        required: false
        default: false
        type: boolean
      force:
        description: Ignore release assets and build site/dist directly
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_PROJECT_PROD: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_PROD }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Make scripts executable
        run: chmod +x scripts/versioning/*.sh scripts/release/*.sh scripts/install/*.sh scripts/astro/*.sh

      - name: Install required tools
        run: |
          ./scripts/install/git.sh
          ./scripts/install/curl.sh
          ./scripts/install/node.sh
          ./scripts/install/gh.sh
          ./scripts/install/wrangler.sh

      - name: Deploy to Cloudflare
        run: |
          ARGS=()

          if [[ "${{ github.event_name }}" == "release" ]]; then
            ARGS+=(--tag "${{ github.event.release.tag_name }}")
          fi

          if [[ "${{ github.event_name }}" == "push" ]]; then
            ARGS+=(--tag "${{ github.ref_name }}")
          fi

          if [[ -n "${{ inputs.version }}" ]]; then
            ARGS+=(--version "${{ inputs.version }}")
          fi

          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            ARGS+=(--dry-run)
          fi

          if [[ "${{ inputs.force }}" == "true" ]]; then
            ARGS+=(--force)
          fi

          ./scripts/release/deploy-to-cloudflare.sh "${ARGS[@]}"

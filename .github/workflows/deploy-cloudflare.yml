---
##########################################################
# Deploy latest Github release asset to Cloudflare Pages #
##########################################################

name: Deploy to Cloudflare Pages

on:
  workflow_call:
    inputs:
      version:
        required: false
        type: string
        default: ""
      tag:
        required: false
        type: string
        default: ""
      dry_run:
        required: false
        type: boolean
        default: false
      force:
        required: false
        type: boolean
        default: false
    secrets:
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_PAGES_PROJECT_PROD:
        required: true

  workflow_dispatch:
    inputs:
      version:
        description: Version/tag to deploy, like 0.1.0. Defaults to latest release.
        required: false
        default: ""
        type: string
      tag:
        description: Explicit tag to deploy, like v0.1.0.
        required: false
        default: ""
        type: string
      dry_run:
        description: Run without deploying anything
        required: false
        default: false
        type: boolean
      force:
        description: Ignore release assets and build site/dist directly
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_PROJECT_PROD: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_PROD }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Make scripts executable
        run: chmod +x scripts/versioning/*.sh scripts/release/*.sh scripts/install/*.sh scripts/astro/*.sh

      - name: Install required tools
        run: |
          ./scripts/install/git.sh
          ./scripts/install/curl.sh
          ./scripts/install/node.sh
          ./scripts/install/gh.sh
          ./scripts/install/wrangler.sh

      - name: Deploy to Cloudflare
        run: |
          ARGS=()

          if [[ -n "${{ inputs.tag }}" ]]; then
            ARGS+=(--tag "${{ inputs.tag }}")
          fi

          if [[ -n "${{ inputs.version }}" ]]; then
            ARGS+=(--version "${{ inputs.version }}")
          fi

          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            ARGS+=(--dry-run)
          fi

          if [[ "${{ inputs.force }}" == "true" ]]; then
            ARGS+=(--force)
          fi

          ./scripts/release/deploy-to-cloudflare.sh "${ARGS[@]}"

---
###########################################################################
# Manual pipeline to ensure a git tag & release exist for current version #
###########################################################################

name: Repair missing release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to repair. Defaults to VERSION file.
        required: false
        default: ""
        type: string
      commit:
        description: Commit SHA to check out before tagging. Optional.
        required: false
        default: ""
        type: string
      dry_run:
        description: Run without changing anything
        required: false
        default: false
        type: boolean

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.repair_release.outputs.version }}
    env:
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit != '' && inputs.commit || github.ref }}

      - name: Make scripts executable
        run: chmod +x scripts/versioning/*.sh scripts/release/*.sh scripts/install/*.sh scripts/astro/*.sh

      - name: Install required tools
        run: |
          ./scripts/install/git.sh
          ./scripts/install/curl.sh
          ./scripts/install/bump-my-version.sh
          ./scripts/install/gh.sh

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Repair missing release
        id: repair_release
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: ./scripts/release/repair-release.sh

  deploy_cloudflare:
    needs: repair
    if: needs.repair.outputs.version != ''
    uses: ./.github/workflows/deploy-cloudflare.yml
    with:
      version: ${{ needs.repair.outputs.version }}
      tag: v${{ needs.repair.outputs.version }}
      dry_run: false
      force: false
    secrets: inherit
